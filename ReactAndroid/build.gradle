plugins {
    id("com.android.library")
    id("maven")
    id("de.undercouch.download")
}

import de.undercouch.gradle.tasks.download.Download
import org.apache.tools.ant.taskdefs.condition.Os
import org.apache.tools.ant.filters.ReplaceTokens

// We download various C++ open-source dependencies into downloads.
// We then copy both the downloaded code and our custom makefiles and headers into third-party-ndk.
// After that we build native code from src/main/jni with module path pointing at third-party-ndk.

def customDownloadsDir = System.getenv("REACT_NATIVE_DOWNLOADS_DIR")
def downloadsDir = customDownloadsDir ? new File(customDownloadsDir) : new File("$buildDir/downloads")
def thirdPartyNdkDir = new File("$buildDir/third-party-ndk")

// You need to have following folders in this directory:
//   - boost_1_63_0
//   - double-conversion-1.1.6
//   - folly-deprecate-dynamic-initializer
//   - glog-0.3.5
def dependenciesPath = System.getenv("REACT_NATIVE_DEPENDENCIES")

// The Boost library is a very large download (>100MB).
// If Boost is already present on your system, define the REACT_NATIVE_BOOST_PATH env variable
// and the build will use that.
def boostPath = dependenciesPath ?: System.getenv("REACT_NATIVE_BOOST_PATH")

task createNativeDepsDirectories {
    downloadsDir.mkdirs()
    thirdPartyNdkDir.mkdirs()
}

task downloadBoost(dependsOn: createNativeDepsDirectories, type: Download) {
    src("https://boostorg.jfrog.io/artifactory/main/release/${BOOST_VERSION.replace("_", ".")}/source/boost_${BOOST_VERSION}.tar.gz")
    onlyIfNewer true
    overwrite false
    dest new File(downloadsDir, "boost_${BOOST_VERSION}.tar.gz")
}

task prepareBoost(dependsOn: boostPath ? [] : [downloadBoost], type: Copy) {
    from boostPath ?: tarTree(resources.gzip(downloadBoost.dest))
    from 'src/main/jni/third-party/boost/Android.mk'
    include 'Android.mk', "boost_${BOOST_VERSION}/boost/**/*.hpp", 'boost/boost/**/*.hpp'
    includeEmptyDirs = false
    into "$thirdPartyNdkDir/boost"
    doLast {
        file("$thirdPartyNdkDir/boost/boost").renameTo("$thirdPartyNdkDir/boost/boost_${BOOST_VERSION}")
    }
}

task downloadDoubleConversion(dependsOn: createNativeDepsDirectories, type: Download) {
    src "https://github.com/google/double-conversion/archive/v${DOUBLE_CONVERSION_VERSION}.tar.gz"
    onlyIfNewer true
    overwrite false
    dest new File(downloadsDir, "double-conversion-${DOUBLE_CONVERSION_VERSION}.tar.gz")
}

task prepareDoubleConversion(dependsOn: dependenciesPath ? [] : [downloadDoubleConversion], type: Copy) {
    from dependenciesPath ?: tarTree(downloadDoubleConversion.dest)
    from 'src/main/jni/third-party/double-conversion/Android.mk'
    include "double-conversion-${DOUBLE_CONVERSION_VERSION}/src/**/*", 'Android.mk'
    filesMatching('*/src/**/*', { fname -> fname.path = "double-conversion/${fname.name}" })
    includeEmptyDirs = false
    into "$thirdPartyNdkDir/double-conversion"
}

task downloadFolly(dependsOn: createNativeDepsDirectories, type: Download) {
    src "https://github.com/facebook/folly/archive/v${FOLLY_VERSION}.tar.gz"
    onlyIfNewer true
    overwrite false
    dest new File(downloadsDir, "folly-${FOLLY_VERSION}.tar.gz");
}

task prepareFolly(dependsOn: dependenciesPath ? [] : [downloadFolly], type: Copy) {
    from dependenciesPath ?: tarTree(downloadFolly.dest)
    from 'src/main/jni/third-party/folly/Android.mk'
    include "folly-${FOLLY_VERSION}/folly/**/*", 'Android.mk'
    eachFile { fname -> fname.path = (fname.path - "folly-${FOLLY_VERSION}/") }
    includeEmptyDirs = false

    // Patch for folly build break on gcc 4.9 and could be removed after build by clang
    filesMatching('**/container/detail/F14Policy.h') {
        filter(ReplaceTokens, tokens: [
            'ObjectHolder(Args&&... args) : value_{std::forward<Args>(args)...} {}': 'ObjectHolder(Args&&... args) : value_({std::forward<Args>(args)...}) {}',
            'ObjectHolder(Args&&... args) : T{std::forward<Args>(args)...} {}': 'ObjectHolder(Args&&... args) : T({std::forward<Args>(args)...}) {}',
        ],
        beginToken: '',
        endToken: '')
    }

    into "$thirdPartyNdkDir/folly"
}

task downloadGlog(dependsOn: createNativeDepsDirectories, type: Download) {
    src "https://github.com/google/glog/archive/v${GLOG_VERSION}.tar.gz"
    onlyIfNewer true
    overwrite false
    dest new File(downloadsDir, "glog-${GLOG_VERSION}.tar.gz")
}

// Prepare glog sources to be compiled, this task will perform steps that normally should've been
// executed by automake. This way we can avoid dependencies on make/automake
task prepareGlog(dependsOn: dependenciesPath ? [] : [downloadGlog], type: Copy) {
    from dependenciesPath ?: tarTree(downloadGlog.dest)
    from 'src/main/jni/third-party/glog/'
    include "glog-${GLOG_VERSION}/src/**/*", 'Android.mk', 'config.h'
    includeEmptyDirs = false
    filesMatching('**/*.h.in') {
        filter(ReplaceTokens, tokens: [
                ac_cv_have_unistd_h           : '1',
                ac_cv_have_stdint_h           : '1',
                ac_cv_have_systypes_h         : '1',
                ac_cv_have_inttypes_h         : '1',
                ac_cv_have_libgflags          : '0',
                ac_google_start_namespace     : 'namespace google {',
                ac_cv_have_uint16_t           : '1',
                ac_cv_have_u_int16_t          : '1',
                ac_cv_have___uint16           : '0',
                ac_google_end_namespace       : '}',
                ac_cv_have___builtin_expect   : '1',
                ac_google_namespace           : 'google',
                ac_cv___attribute___noinline  : '__attribute__ ((noinline))',
                ac_cv___attribute___noreturn  : '__attribute__ ((noreturn))',
                ac_cv___attribute___printf_4_5: '__attribute__((__format__ (__printf__, 4, 5)))'
        ])
        it.path = (it.name - '.in')
    }
    into "$thirdPartyNdkDir/glog"

    doLast {
        copy {
            from fileTree(dir: "$thirdPartyNdkDir/glog", includes: ["stl_logging.h", "logging.h", "raw_logging.h", "vlog_is_on.h", "**/glog/log_severity.h"]).files
            includeEmptyDirs = false
            into "$thirdPartyNdkDir/glog/exported/glog"
        }
        copy {
            from "$thirdPartyNdkDir/glog/glog-${GLOG_VERSION}/src/glog/log_severity.h"
            into "$thirdPartyNdkDir/glog/exported/glog"
        }
    }
}

task downloadJSC(dependsOn: createNativeDepsDirectories, type: Download) {
    src "https://registry.npmjs.org/jsc-android/-/jsc-android-${JSC_VERSION}.tgz"
    onlyIfNewer true
    overwrite false
    dest new File(downloadsDir, "jsc-${JSC_VERSION}.tar.gz")
}

// Create Android.mk library module based on jsc from npm
task prepareJSC(dependsOn: downloadJSC) {
    doLast {
        def jscTar = tarTree(downloadJSC.dest)
        def jscAAR = jscTar.matching({ it.include "**/android-jsc/**/*.aar" }).singleFile
        def soFiles = zipTree(jscAAR).matching({ it.include "**/*.so" })

        def headerFiles = jscTar.matching({ it.include "**/include/*.h" })
        
        copy {
            from soFiles
            from headerFiles
            from "src/main/jni/third-party/jsc/Android.mk"

            filesMatching("**/*.h", { it.path = "JavaScriptCore/${it.name}"})

            includeEmptyDirs false
            into "$thirdPartyNdkDir/jsc"
        }
    }
    
}

def hermesTarballOverride = project.findProperty("HERMES_TARBALL_OVERRIDE") ?: System.getenv("HERMES_TARBALL_OVERRIDE")

task downloadHermes(dependsOn: createNativeDepsDirectories, type: Download) {
    src "https://registry.npmjs.org/@kuss/hermes-engine/-/hermes-engine-${HERMES_VERSION}.tgz"
    onlyIfNewer true
    overwrite false
    dest new File(downloadsDir, "hermes-${HERMES_VERSION}.tar.gz")
    enabled hermesTarballOverride == null || hermesTarballOverride == ""
}

task prepareHermes(dependsOn: hermesTarballOverride ? createNativeDepsDirectories : downloadHermes) {
    doLast {
        def hermesArchive = hermesTarballOverride ? file(hermesTarballOverride) : downloadHermes.dest
        if (!hermesArchive.exists()) {
            throw new GradleException("Hermes tarball not found: ${hermesArchive}")
        }

        delete "$thirdPartyNdkDir/hermes"

        def hermesTar = tarTree(hermesArchive)
        def hermesAAR = hermesTar.matching({ it.include "**/android/hermes-release.aar" }).singleFile
        def soFiles = zipTree(hermesAAR).matching({ it.include "**/*.so" })
        def headerFiles = hermesTar.matching({ it.include "**/android/include/**/*.h" })

        copy {
            from soFiles
            from "src/main/jni/first-party/hermes/Android.mk"
            from headerFiles

            filesMatching("**/hermes/*.h", { it.path = "hermes/${it.name}" })
            filesMatching("**/Public/*.h", { it.path = "hermes/Public/${it.name}" })
            filesMatching("**/jsi/*.h", { it.path = "hermes/jsi/${it.name}" })

            includeEmptyDirs false
            into "$thirdPartyNdkDir/hermes"
        }
    }
    
}

task downloadNdkBuildDependencies {
    if (!boostPath) {
        dependsOn downloadBoost
    }
    dependsOn downloadDoubleConversion
    dependsOn downloadFolly
    dependsOn downloadGlog
    dependsOn downloadJSC
}

task extractAARHeaders {
    doLast {
        configurations.extractHeaders.files.each {
            def file = it.absoluteFile
            def packageName = file.name.tokenize('-')[0]
            copy {
                from zipTree(file)
                into "$projectDir/src/main/jni/first-party/$packageName/headers"
                include "**/*.h"
            }
        }
    }
}

task extractJNIFiles {
    doLast {
        configurations.extractJNI.files.each {
            def file = it.absoluteFile
            def packageName = file.name.tokenize('-')[0]
            copy {
                from zipTree(file)
                into "$projectDir/src/main/jni/first-party/$packageName/"
                include "jni/**/*"
            }
        }
    }
}

def getNdkBuildName() {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        return "ndk-build.cmd"
    } else {
        return "ndk-build"
    }
}

def findNdkBuildFullPath() {
    // we allow to provide full path to ndk-build tool
    if (hasProperty('ndk.command')) {
        return property('ndk.command')
    }
    // or just a path to the containing directory
    if (hasProperty('ndk.path')) {
        def ndkDir = property('ndk.path')
        return new File(ndkDir, getNdkBuildName()).getAbsolutePath()
    }
    if (System.getenv('ANDROID_NDK') != null) {
        def ndkDir = System.getenv('ANDROID_NDK')
        return new File(ndkDir, getNdkBuildName()).getAbsolutePath()
    }
    def ndkDir = android.hasProperty('plugin') ? android.plugin.ndkFolder :
            plugins.getPlugin('com.android.library').hasProperty('sdkHandler') ?
                    plugins.getPlugin('com.android.library').sdkHandler.getNdkFolder() :
                    android.ndkDirectory.absolutePath
    if (ndkDir) {
        return new File(ndkDir, getNdkBuildName()).getAbsolutePath()
    }
    return null
}

def getNdkBuildFullPath() {
    def ndkBuildFullPath = findNdkBuildFullPath()
    if (ndkBuildFullPath == null) {
        throw new GradleScriptException(
                "ndk-build binary cannot be found, check if you've set " +
                        "\$ANDROID_NDK environment variable correctly or if ndk.dir is " +
                        "setup in local.properties",
                null)
    }
    if (!new File(ndkBuildFullPath).canExecute()) {
        throw new GradleScriptException(
                "ndk-build binary " + ndkBuildFullPath + " doesn't exist or isn't executable.\n" +
                        "Check that the \$ANDROID_NDK environment variable, or ndk.dir in local.properties, is set correctly.\n" +
                        "(On Windows, make sure you escape backslashes in local.properties or use forward slashes, e.g. C:\\\\ndk or C:/ndk rather than C:\\ndk)",
                null)
    }
    return ndkBuildFullPath
}

def ELF_64BIT = 2
def ELF_LITTLE_ENDIAN = 1
def ELF_BIG_ENDIAN = 2
def ELF_LOAD_SEGMENT = 1L
def ELF_16KB_PAGE_SIZE = 16 * 1024L

def readElfValue = { RandomAccessFile file, long offset, int byteCount, boolean littleEndian ->
    byte[] bytes = new byte[byteCount]
    file.seek(offset)
    file.readFully(bytes)

    long value = 0
    if (littleEndian) {
        for (int i = byteCount - 1; i >= 0; i--) {
            value = (value << 8) | (bytes[i] & 0xff)
        }
    } else {
        for (int i = 0; i < byteCount; i++) {
            value = (value << 8) | (bytes[i] & 0xff)
        }
    }
    return value
}

def writeElfValue = { RandomAccessFile file, long offset, int byteCount, long value, boolean littleEndian ->
    byte[] bytes = new byte[byteCount]
    for (int i = 0; i < byteCount; i++) {
        int index = littleEndian ? i : byteCount - 1 - i
        bytes[index] = (byte) ((value >> (8 * i)) & 0xff)
    }

    file.seek(offset)
    file.write(bytes)
}

def readElfBytesValue = { byte[] bytes, long offset, int byteCount, boolean littleEndian ->
    long value = 0
    if (littleEndian) {
        for (int i = byteCount - 1; i >= 0; i--) {
            value = (value << 8) | (bytes[(int) offset + i] & 0xff)
        }
    } else {
        for (int i = 0; i < byteCount; i++) {
            value = (value << 8) | (bytes[(int) offset + i] & 0xff)
        }
    }
    return value
}

def writeElfBytesValue = { byte[] bytes, long offset, int byteCount, long value, boolean littleEndian ->
    for (int i = 0; i < byteCount; i++) {
        int index = littleEndian ? i : byteCount - 1 - i
        bytes[(int) offset + index] = (byte) ((value >> (8 * i)) & 0xff)
    }
}

def insertElfPadding = { byte[] bytes, long offset, int padding ->
    byte[] padded = new byte[bytes.length + padding]
    System.arraycopy(bytes, 0, padded, 0, (int) offset)
    System.arraycopy(bytes, (int) offset, padded, (int) offset + padding, bytes.length - (int) offset)
    return padded
}

def shiftElfOffsets = { byte[] bytes, long insertionOffset, int padding, boolean littleEndian ->
    long programHeaderOffset = readElfBytesValue(bytes, 32, 8, littleEndian)
    if (programHeaderOffset >= insertionOffset && programHeaderOffset != 0L) {
        programHeaderOffset += padding
        writeElfBytesValue(bytes, 32, 8, programHeaderOffset, littleEndian)
    }

    int programHeaderEntrySize = (int) readElfBytesValue(bytes, 54, 2, littleEndian)
    int programHeaderCount = (int) readElfBytesValue(bytes, 56, 2, littleEndian)
    for (int i = 0; i < programHeaderCount; i++) {
        long entryOffset = programHeaderOffset + (i * programHeaderEntrySize)
        long segmentFileOffset = readElfBytesValue(bytes, entryOffset + 8, 8, littleEndian)
        if (segmentFileOffset >= insertionOffset && segmentFileOffset != 0L) {
            writeElfBytesValue(bytes, entryOffset + 8, 8, segmentFileOffset + padding, littleEndian)
        }
    }

    long sectionHeaderOffset = readElfBytesValue(bytes, 40, 8, littleEndian)
    if (sectionHeaderOffset >= insertionOffset && sectionHeaderOffset != 0L) {
        sectionHeaderOffset += padding
        writeElfBytesValue(bytes, 40, 8, sectionHeaderOffset, littleEndian)
    }

    int sectionHeaderEntrySize = (int) readElfBytesValue(bytes, 58, 2, littleEndian)
    int sectionHeaderCount = (int) readElfBytesValue(bytes, 60, 2, littleEndian)
    for (int i = 0; i < sectionHeaderCount; i++) {
        long entryOffset = sectionHeaderOffset + (i * sectionHeaderEntrySize)
        long sectionFileOffset = readElfBytesValue(bytes, entryOffset + 24, 8, littleEndian)
        if (sectionFileOffset >= insertionOffset && sectionFileOffset != 0L) {
            writeElfBytesValue(bytes, entryOffset + 24, 8, sectionFileOffset + padding, littleEndian)
        }
    }
}

def readElf64LoadSegments = { byte[] bytes, boolean littleEndian ->
    def loadSegments = []
    long programHeaderOffset = readElfBytesValue(bytes, 32, 8, littleEndian)
    int programHeaderEntrySize = (int) readElfBytesValue(bytes, 54, 2, littleEndian)
    int programHeaderCount = (int) readElfBytesValue(bytes, 56, 2, littleEndian)

    for (int i = 0; i < programHeaderCount; i++) {
        long entryOffset = programHeaderOffset + (i * programHeaderEntrySize)
        long segmentType = readElfBytesValue(bytes, entryOffset, 4, littleEndian)
        if (segmentType != ELF_LOAD_SEGMENT) {
            continue
        }

        loadSegments << [
                entryOffset: entryOffset,
                fileOffset: readElfBytesValue(bytes, entryOffset + 8, 8, littleEndian),
                virtualAddress: readElfBytesValue(bytes, entryOffset + 16, 8, littleEndian),
                alignment: readElfBytesValue(bytes, entryOffset + 48, 8, littleEndian),
        ]
    }

    return loadSegments.sort { it.fileOffset }
}

def forEachElf64LoadSegment = { File sharedObject, String mode, Closure visitor ->
    if (!sharedObject.exists()) {
        return
    }

    RandomAccessFile file = new RandomAccessFile(sharedObject, mode)
    try {
        if (file.length() < 64) {
            return
        }

        byte[] ident = new byte[16]
        file.seek(0)
        file.readFully(ident)

        if ((ident[0] & 0xff) != 0x7f || ident[1] != 0x45 || ident[2] != 0x4c || ident[3] != 0x46) {
            return
        }

        int elfClass = ident[4] & 0xff
        int elfData = ident[5] & 0xff
        if (elfClass != ELF_64BIT) {
            return
        }
        if (elfData != ELF_LITTLE_ENDIAN && elfData != ELF_BIG_ENDIAN) {
            throw new GradleException("Unsupported ELF byte order in ${sharedObject}")
        }

        boolean littleEndian = elfData == ELF_LITTLE_ENDIAN
        long programHeaderOffset = readElfValue(file, 32, 8, littleEndian)
        int programHeaderEntrySize = (int) readElfValue(file, 54, 2, littleEndian)
        int programHeaderCount = (int) readElfValue(file, 56, 2, littleEndian)

        for (int i = 0; i < programHeaderCount; i++) {
            long entryOffset = programHeaderOffset + (i * programHeaderEntrySize)
            if (entryOffset + programHeaderEntrySize > file.length()) {
                throw new GradleException("Invalid ELF program header in ${sharedObject}")
            }

            long segmentType = readElfValue(file, entryOffset, 4, littleEndian)
            if (segmentType != ELF_LOAD_SEGMENT) {
                continue
            }

            long segmentFileOffset = readElfValue(file, entryOffset + 8, 8, littleEndian)
            long segmentVirtualAddress = readElfValue(file, entryOffset + 16, 8, littleEndian)
            long segmentAlignment = readElfValue(file, entryOffset + 48, 8, littleEndian)
            visitor.call(file, sharedObject, entryOffset, segmentFileOffset, segmentVirtualAddress, segmentAlignment, littleEndian)
        }
    } finally {
        file.close()
    }
}

def formatElfHex = { long value ->
    return "0x${Long.toHexString(value)}"
}

def patchElf16KbAlignment = { File sharedObject ->
    if (!sharedObject.exists()) {
        return
    }

    byte[] bytes = sharedObject.bytes
    if (bytes.length < 64 ||
            (bytes[0] & 0xff) != 0x7f || bytes[1] != 0x45 || bytes[2] != 0x4c || bytes[3] != 0x46 ||
            (bytes[4] & 0xff) != ELF_64BIT) {
        return
    }

    int elfData = bytes[5] & 0xff
    if (elfData != ELF_LITTLE_ENDIAN && elfData != ELF_BIG_ENDIAN) {
        throw new GradleException("Unsupported ELF byte order in ${sharedObject}")
    }

    boolean littleEndian = elfData == ELF_LITTLE_ENDIAN
    boolean patched = false
    while (true) {
        def segment = readElf64LoadSegments(bytes, littleEndian).find { it.alignment < ELF_16KB_PAGE_SIZE }
        if (segment == null) {
            break
        }

        int padding = (int) (((segment.virtualAddress % ELF_16KB_PAGE_SIZE) -
                (segment.fileOffset % ELF_16KB_PAGE_SIZE) + ELF_16KB_PAGE_SIZE) % ELF_16KB_PAGE_SIZE)
        if (padding > 0) {
            if (segment.fileOffset <= 0L || segment.fileOffset > bytes.length) {
                throw new GradleException(
                        "Cannot safely align ${sharedObject} for 16 KB pages. " +
                        "LOAD offset=${formatElfHex(segment.fileOffset)} vaddr=${formatElfHex(segment.virtualAddress)} " +
                        "align=${formatElfHex(segment.alignment)}")
            }

            bytes = insertElfPadding(bytes, segment.fileOffset, padding)
            shiftElfOffsets(bytes, segment.fileOffset, padding, littleEndian)
            patched = true
            continue
        }

        writeElfBytesValue(bytes, segment.entryOffset + 48, 8, ELF_16KB_PAGE_SIZE, littleEndian)
        patched = true
    }

    if (patched) {
        sharedObject.withOutputStream { it.write(bytes) }
        println "Patched 16 KB ELF alignment: ${sharedObject}"
    }
}

def findElf16KbAlignmentErrors = { File sharedObject ->
    def errors = []

    forEachElf64LoadSegment(sharedObject, "r") {
        RandomAccessFile file,
        File soFile,
        long entryOffset,
        long segmentFileOffset,
        long segmentVirtualAddress,
        long segmentAlignment,
        boolean littleEndian ->

        if (segmentAlignment < ELF_16KB_PAGE_SIZE) {
            errors << "${soFile}: LOAD offset=${formatElfHex(segmentFileOffset)} " +
                    "vaddr=${formatElfHex(segmentVirtualAddress)} align=${formatElfHex(segmentAlignment)}"
        } else if ((segmentFileOffset % ELF_16KB_PAGE_SIZE) != (segmentVirtualAddress % ELF_16KB_PAGE_SIZE)) {
            errors << "${soFile}: LOAD offset=${formatElfHex(segmentFileOffset)} " +
                    "vaddr=${formatElfHex(segmentVirtualAddress)} align=${formatElfHex(segmentAlignment)} " +
                    "does not satisfy offset % 16 KB == vaddr % 16 KB"
        }
    }

    return errors
}

task alignPrebuiltNdkLibs16Kb(dependsOn: [prepareJSC, prepareHermes, extractJNIFiles]) {
    doLast {
        throw new GradleException("Do not patch ELF program headers for 16 KB page-size support. Use shared libraries rebuilt with -Wl,-z,max-page-size=16384 instead.")
    }
}

task buildReactNdkLib(dependsOn: [prepareJSC, prepareHermes, prepareBoost, prepareDoubleConversion, prepareFolly, prepareGlog, extractAARHeaders, extractJNIFiles], type: Exec) {
    inputs.dir('src/main/jni/react')
    inputs.dir(thirdPartyNdkDir)
    inputs.dir("$projectDir/src/main/jni/first-party/fbjni")
    outputs.dir("$buildDir/react-ndk/all")
    commandLine getNdkBuildFullPath(),
            'NDK_PROJECT_PATH=null',
            "NDK_APPLICATION_MK=$projectDir/src/main/jni/Application.mk",
            'NDK_OUT=' + temporaryDir,
            "NDK_LIBS_OUT=$buildDir/react-ndk/all",
            "THIRD_PARTY_NDK_DIR=$buildDir/third-party-ndk",
            "REACT_COMMON_DIR=$projectDir/../ReactCommon",
            "REACT_SRC_DIR=$projectDir/src/main/java/com/facebook/react",
            '-C', file('src/main/jni/react/jni').absolutePath,
            '--jobs', project.findProperty("jobs") ?: Runtime.runtime.availableProcessors()
}

task cleanReactNdkLib(type: Exec) {
    ignoreExitValue true
    errorOutput new ByteArrayOutputStream()
    commandLine getNdkBuildFullPath(),
            "NDK_APPLICATION_MK=$projectDir/src/main/jni/Application.mk",
            "THIRD_PARTY_NDK_DIR=$buildDir/third-party-ndk",
            "REACT_COMMON_DIR=$projectDir/../ReactCommon",
            '-C', file('src/main/jni/react/jni').absolutePath,
            'clean'
    doLast {
        file(AAR_OUTPUT_URL).delete()
        println "Deleted aar output dir at ${file(AAR_OUTPUT_URL)}"
    }
}

task packageReactNdkLibs(dependsOn: buildReactNdkLib, type: Copy) {
    from "$buildDir/react-ndk/all"
    from "$thirdPartyNdkDir/jsc/jni"
    into "$buildDir/react-ndk/exported"
}

task verifyReactNdkLibs16KbPageSize(dependsOn: packageReactNdkLibs) {
    doLast {
        def errors = []
        // Android devices that require 16 KB pages are arm64-v8a; x86_64 JSC is
        // still a legacy 4 KB prebuilt in this fork.
        ["arm64-v8a"].each { abi ->
            errors.addAll(fileTree(dir: "$buildDir/react-ndk/exported/${abi}", includes: ["*.so"]).files.collectMany {
                findElf16KbAlignmentErrors(it)
            })
        }

        if (!errors.empty) {
            throw new GradleException("ReactAndroid contains shared libraries that are not 16 KB page-size aligned:\n" + errors.join("\n"))
        }
    }
}

task packageReactNdkLibsForBuck(dependsOn: packageReactNdkLibs, type: Copy) {
    from "$buildDir/react-ndk/exported"
    into "src/main/jni/prebuilt/lib"
}

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'proguard-rules.pro'

        ndk {
            moduleName "reactnativejni"
        }

        buildConfigField 'boolean', 'IS_INTERNAL_BUILD', 'false'
        buildConfigField 'int', 'EXOPACKAGE_FLAGS', '0'
        testApplicationId "com.facebook.react.tests.gradle"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir "$buildDir/react-ndk/exported"
        res.srcDirs = ['src/main/res/devsupport', 'src/main/res/shell', 'src/main/res/views/modal', 'src/main/res/views/uimanager']
        java {
            srcDirs = ['src/main/java', 'src/main/libraries/soloader/java', 'src/main/jni/first-party/fb/jni/java']
            exclude 'com/facebook/react/processing'
            exclude 'com/facebook/react/module/processing'
        }
    }

    tasks.withType(JavaCompile) {
        compileTask -> compileTask.dependsOn verifyReactNdkLibs16KbPageSize
    }

    clean.dependsOn cleanReactNdkLib

    lintOptions {
        abortOnError false
    }
    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }

    configurations {
        extractHeaders
        extractJNI
    }
}

dependencies {
    api 'com.facebook.infer.annotation:infer-annotation:0.11.2'
    api 'javax.inject:javax.inject:1'
    api 'androidx.appcompat:appcompat:1.4.1'
    api "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    api "com.facebook.fresco:fresco:${FRESCO_VERSION}"
    api "com.facebook.fresco:imagepipeline-okhttp3:${FRESCO_VERSION}"
    api "com.facebook.fresco:ui-common:${FRESCO_VERSION}"
    api "com.facebook.soloader:soloader:${SO_LOADER_VERSION}"
    api 'com.google.code.findbugs:jsr305:3.0.2'
    api "com.squareup.okhttp3:okhttp:${OKHTTP_VERSION}"
    api "com.squareup.okhttp3:okhttp-urlconnection:${OKHTTP_VERSION}"
    api 'com.squareup.okio:okio:2.9.0'
    api("com.facebook.fbjni:fbjni-java-only:${FBJNI_VERSION}")
    extractHeaders("com.facebook.fbjni:fbjni:${FBJNI_VERSION}:headers")
    extractJNI("com.facebook.fbjni:fbjni:${FBJNI_NATIVE_VERSION}")
}

apply from: 'release.gradle'
